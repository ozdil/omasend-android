name: Android check

# Unit tests and a debug build for pull requests and the dev branch.
# Releases stay in build-apk.yml.
on:
  pull_request:
  push:
    branches: [ next ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      # Lets reviewers install the build from the run page without building locally.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: omasend-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
