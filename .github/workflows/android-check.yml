name: Android check

# Unit tests and a debug build for pull requests and the dev branch.
# Releases stay in build-apk.yml.
on:
  pull_request:
  push:
    branches: [ next ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Regenerate dependency checksums (temporary)
        run: |
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 testDebugUnitTest assembleDebug --dependency-verification lenient --console=plain || true
          echo "=====VERIFICATION-DIFF-BEGIN====="
          git diff gradle/verification-metadata.xml
          echo "=====VERIFICATION-DIFF-END====="

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
