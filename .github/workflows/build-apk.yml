name: Build & Release Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK & Release Bundle
        run: ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p dist_artifacts
          cp app/build/outputs/apk/debug/app-debug.apk dist_artifacts/omasend-android.apk
          cp app/build/outputs/bundle/release/app-release.aab dist_artifacts/omasend-android.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omasend-android-build
          path: dist_artifacts/*

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist_artifacts/omasend-android.apk
            dist_artifacts/omasend-android.aab
